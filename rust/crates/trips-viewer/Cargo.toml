# trips-viewer — the native Mac TRIPS viewer (v0.4.0).
#
# Lives in trippy's OWN thin workspace, not in the Brush fork's, and depends on
# the fork only through `brush-pyramid`'s existing path dependencies. See
# docs/decisions/ADR-0006-viewer-integration.md for why the alternative (moving
# brush-pyramid/brush-unet into `rust/brush-trips/crates` so `apps/brush-app`
# could reach them) was not taken. Consequence worth knowing: Brush's own
# `brush` binary is untouched, so its .ply viewing cannot regress.
[package]
name = "trips-viewer"
edition.workspace = true
version.workspace = true
license.workspace = true

# The platform-neutral half (bundle loading, camera, the per-frame pipeline).
# `rust/crates/trips-web` depends on THIS target to render the same scene the
# same way in a browser; see src/lib.rs's invariants for what may not go in it.
[lib]
name = "trips_viewer"
path = "src/lib.rs"

[[bin]]
name = "trips-viewer"
path = "src/main.rs"

[dependencies]
brush-pyramid = { path = "../brush-pyramid", features = ["gpu"] }
brush-unet = { path = "../brush-unet", features = ["gpu"] }

burn.workspace = true
burn-wgpu.workspace = true

glam.workspace = true
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true

# Everything the wasm build must NOT see. Two groups, one reason each:
#
#   * the window/UI stack -- `eframe` drags in winit and `rfd` a native file
#     dialog, neither of which builds for wasm32-unknown-unknown, and the web
#     viewer has no use for either (its "file dialog" is a URL and its window is
#     a <canvas>);
#   * the LIVE Gaussian-splat half of the Blend panel (`src/splat.rs`) -- Brush's
#     own rasteriser and its .ply reader, reached by path into the submodule
#     exactly the way `brush-pyramid` already reaches
#     `brush-cube`/`brush-sort`/`brush-prefix-sum` (ADR-0005). A browser has no
#     filesystem to open a 2 GB .ply from, and `src/lib.rs` keeps
#     `pub mod splat` behind the same cfg, so the wasm graph is byte-for-byte
#     the one v0.5.0 shipped.
#
# `brush-serde` -- NOT `brush-dataset` -- is the ply loader: the dataset crate is
# the same loader plus `image`, `jpeg-decoder`, `reqwest`, `async_zip`,
# `colmap-reader` and `clap`, none of which a viewer needs. `tokio` is here only
# for its `AsyncRead` trait, which `src/splat.rs` implements over a plain
# `std::fs::File` so a multi-GB ply streams instead of being read into memory
# whole. docs/WEB_VIEWER.md records this split.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
brush-render = { path = "../../brush-trips/crates/brush-render" }
brush-serde = { path = "../../brush-trips/crates/brush-serde" }
tokio.workspace = true

eframe.workspace = true
egui.workspace = true
wgpu.workspace = true
anyhow.workspace = true
env_logger.workspace = true
rfd.workspace = true

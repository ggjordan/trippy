# rust/Cargo.toml — thin virtual workspace for trippy's OWN Rust crates.
#
# Purpose: this is intentionally NOT the Brush fork's workspace. `rust/brush-trips`
# (a git submodule, see ../.gitmodules) is its own separate Cargo workspace with its
# own version, pinned to a specific upstream commit plus Splats' patch set (see
# docs/UPSTREAM.md and rust/README.md). Keeping the two workspaces apart means:
#   - `scripts/build.sh` / `scripts/test.sh` stay fast (seconds, not the many minutes
#     a full `cargo check --workspace` over vendored Brush would take) because they
#     only ever compile brush-pyramid/brush-unet WITHOUT the `gpu` feature, and
#     without that feature neither crate has a single dependency outside serde.
#   - `[workspace.package].version` here can track trippy's own VERSION file (see
#     tests/test_version_sync.py) independently of Brush's own version.
#
# The `gpu` feature of `brush-pyramid` pulls Burn/CubeCL/wgpu plus three crates from
# the submodule (`brush-cube`, `brush-sort`, `brush-prefix-sum`) by *path*. A path
# dependency across a workspace boundary is fine — the depended-on package keeps
# inheriting its own `workspace = true` keys from `rust/brush-trips/Cargo.toml` — but
# `[patch]` tables are only read from the workspace root that is actually being
# built, so the two blocks at the bottom of this file must stay a verbatim copy of
# `rust/brush-trips/Cargo.toml`'s. Without them we would silently build against
# unpatched upstream wgpu/cubecl, which cannot compile Brush's kernels to MSL
# (see the comment above the cubecl block). ADR-0005 records this choice.
#
# Related docs: docs/decisions/ADR-0005-brush-fork-layout.md, docs/UPSTREAM.md,
# rust/README.md, docs/ARCHITECTURE.md ("Later: Brush fork mapping").
[workspace]
resolver = "2"
members = ["crates/brush-pyramid", "crates/brush-unet"]
# `rust/brush-trips` physically lives inside this workspace's directory, and Cargo
# auto-adopts any path dependency under the workspace root as a member. Without this
# exclude, `brush-cube` & co. would be pulled into THIS workspace and their
# `foo.workspace = true` keys would be looked up in the table above instead of in the
# submodule's own `[workspace.dependencies]` (which is where they belong), failing
# with "`dependency.log` was not found in `workspace.dependencies`".
exclude = ["brush-trips"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

# Every spec below must match `rust/brush-trips/Cargo.toml`'s byte for byte: two
# different git specs (`branch = "main"` here vs a `rev = ...` there) for the same
# repository are two different Cargo sources, and a crate cannot be linked against
# both. `Cargo.lock` is what actually pins the revisions; it is seeded from the
# submodule's own lock so both workspaces compile the same Burn/CubeCL/wgpu.
[workspace.dependencies]
burn = { git = "https://github.com/tracel-ai/burn", branch = "main", default-features = false, features = [
    'std',
    'optim',
    'extension',
] }
burn-cubecl = { git = "https://github.com/tracel-ai/burn", branch = "main" }
burn-ir = { git = "https://github.com/tracel-ai/burn", branch = "main" }
burn-wgpu = { git = "https://github.com/tracel-ai/burn", branch = "main", features = [
    "exclusive-memory-only",
] }
burn-fusion = { git = "https://github.com/tracel-ai/burn", branch = "main" }
bytemuck = "1.20"
safetensors = "0.7"
glam = { version = "0.30", features = ["serde"] }
serde = { version = "1.0.215", default-features = false, features = [
    "derive",
    "alloc",
] }
serde_json = { version = "1.0.133", default-features = false, features = ["std"] }
tracing = "0.1.41"

# --- verbatim copy of rust/brush-trips/Cargo.toml's patch tables ---------------
# wgpu fork (v30.0.0 + 2 commits): WebGPU subgroups feature mapping + the JS
# interop constructors. See the submodule's Cargo.toml for the full rationale.
[patch.crates-io]
wgpu                 = { git = "https://github.com/ArthurBrussee/wgpu", branch = "js-interop-30" }
wgpu-core            = { git = "https://github.com/ArthurBrussee/wgpu", branch = "js-interop-30" }
wgpu-hal             = { git = "https://github.com/ArthurBrussee/wgpu", branch = "js-interop-30" }
wgpu-types           = { git = "https://github.com/ArthurBrussee/wgpu", branch = "js-interop-30" }
naga                 = { git = "https://github.com/ArthurBrussee/wgpu", branch = "js-interop-30" }

# cubecl-runtime at the rev burn pins doesn't build for wasm, and native MSL needs
# the `workgroup_uniform_load` barrier fix (tracel-ai/cubecl#1525). The whole family
# must be patched together — patching one crate would split the tree via its
# path-deps.
[patch."https://github.com/tracel-ai/cubecl"]
cubecl                 = { git = "https://github.com/ArthurBrussee/cubecl", branch = "msl-trial" }
cubecl-common          = { git = "https://github.com/ArthurBrussee/cubecl", branch = "msl-trial" }
cubecl-core            = { git = "https://github.com/ArthurBrussee/cubecl", branch = "msl-trial" }
cubecl-cpp             = { git = "https://github.com/ArthurBrussee/cubecl", branch = "msl-trial" }
cubecl-cpu             = { git = "https://github.com/ArthurBrussee/cubecl", branch = "msl-trial" }
cubecl-cuda            = { git = "https://github.com/ArthurBrussee/cubecl", branch = "msl-trial" }
cubecl-environment     = { git = "https://github.com/ArthurBrussee/cubecl", branch = "msl-trial" }
cubecl-hip             = { git = "https://github.com/ArthurBrussee/cubecl", branch = "msl-trial" }
cubecl-ir              = { git = "https://github.com/ArthurBrussee/cubecl", branch = "msl-trial" }
cubecl-macros          = { git = "https://github.com/ArthurBrussee/cubecl", branch = "msl-trial" }
cubecl-macros-internal = { git = "https://github.com/ArthurBrussee/cubecl", branch = "msl-trial" }
cubecl-opt             = { git = "https://github.com/ArthurBrussee/cubecl", branch = "msl-trial" }
cubecl-runtime         = { git = "https://github.com/ArthurBrussee/cubecl", branch = "msl-trial" }
cubecl-std             = { git = "https://github.com/ArthurBrussee/cubecl", branch = "msl-trial" }
cubecl-wgpu            = { git = "https://github.com/ArthurBrussee/cubecl", branch = "msl-trial" }
cubecl-zspace          = { git = "https://github.com/ArthurBrussee/cubecl", branch = "msl-trial" }

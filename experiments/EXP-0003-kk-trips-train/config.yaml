# EXP-0003: full kk-coherent training run (point source 1, trained Gaussian centres).
# See docs/EXPERIMENTS.md "Training runs" for the config file format (only fields that
# differ from TrainConfig's scaled-for-trippy defaults need to be listed here) and
# experiments/EXP-0003-kk-trips-train/README.md for the question/gate this run answers.
#
# Run via: trippy train --config experiments/EXP-0003-kk-trips-train/config.yaml
# (through scripts/gpu_submit.sh --train, never invoked directly -- see AGENTS.md).

scene_root: /Users/nzbirdranch/Splats/scenes/karekare/kk-coherent
run_dir: output/runs/EXP-0003-kk-trips-train/EXP-0003-kk-trips-train_1

width: 1008
crop: 384
mode: trips
layers: 5
epochs: 150

point_source:
  type: gaussian
  path: /Users/nzbirdranch/Splats/output/Training-Data/karekare/kk-coherent/kkc_15000.ply
  min_opacity: 0.05
  size_mode: scale

# Every kk-coherent eval must report a shade-region number (docs/SPEC.md "Context";
# docs/EXPERIMENTS.md's dolly-camera note anchors on IMG_3830.jpg).
forced_heldout:
  - IMG_3828.jpg
  - IMG_3829.jpg
  - IMG_3830.jpg
  - IMG_3831.jpg
  - IMG_3832.jpg
  - IMG_3833.jpg

device: mps
seed: 0

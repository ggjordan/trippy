# EXP-0011 REMOVAL arm: config.yaml plus EXP-0010 arm A' (TRIPS's point-removal rule in
# its `relative` form). Everything else is config.yaml verbatim, so the only difference
# from kkv2-full-masked's numbers is the removal itself.
#
# Why `relative` and not arm A's `absolute`: trippy initialises each point's confidence
# from the source PLY's own opacity, not from TRIPS's uniform sigmoid(10*0.5) = 0.9933,
# so an absolute cutoff mostly measures where a point STARTED. `relative` drops a point
# once its confidence has fallen below rel_factor (0.3) times its OWN initial value --
# what TRIPS's absolute cutoff means for free under its uniform init. See
# experiments/EXP-0010-point-removal/README.md and docs/EXPERIMENTS.md "Point removal".
#
# Run via: scripts/queue_training.sh experiments/EXP-0011-karekare-v2/config_removal.yaml \
#   --max-minutes 420      (never invoked directly -- AGENTS.md "GPU and compute").

# The run_dir basename carries a queue-ORDER digit (kkv2-0-smoke, -1-full-masked, ...)
# because scripts/queue_training.sh derives the queue job name from it and the runner picks
# the lowest-sorted filename within a priority (~/Splats/tools/gpu_queue/runner.sh). All
# EXP-0011 jobs sit at prio 70, so the digit is what makes the smoke run before the 7-hour
# trainings and the render shards before the hybrid.
run_dir: /Users/nzbirdranch/trippy/output/runs/EXP-0011-karekare-v2/kkv2-3-removal

scene_root: /Users/nzbirdranch/Splats/scenes/karekare/karekare-v2

# Person masks. "" auto-discovers <scene_root>/masks (1376 PNGs, BLACK = person,
# WHITE = keep -- verified numerically, see README "Masks"). ON here because the
# Gaussian baseline this run is compared against (kklid_20000) was itself trained
# with these masks: scoring TRIPS over pixels the splat never had to reconstruct
# would compare two different quantities. config_unmasked.yaml is the same run with
# use_masks: false, which is what Jordan asked to see next to it.
masks_dir: ""
use_masks: true

width: 1008
crop: 384
# broadcast: trips mode measured ~1.1x broadcast per step after the vectorised-emission
# fix (PR #35), but every EXP-0003/0009/0010 arm on this recipe is broadcast, so this
# stays broadcast to keep the comparison one-variable.
mode: broadcast
layers: 5
epochs: 300
# 1.0 x 664 training images = 664 crops per epoch.
train_factor: 1.0

point_source:
  type: gaussian
  # Jordan's best splat, trained on exactly this COLMAP model (756 registered images).
  path: /Users/nzbirdranch/Splats/output/Training-Data/karekare/karekare-lid/kklid_20000.ply
  min_opacity: 0.05
  # knn: mean 4-NN distance (TRIPS's own size init). Gaussian scales project sub-pixel
  # at 1008 wide, leaving the U-Net to invent ~90% of every frame (measured, EXP-0003).
  size_mode: knn

# 1 in 16 of the non-shade frames is held out (not the default 1 in 8): 756 images is
# 3.4x kk-coherent, and a full-frame eval at 1008 costs ~3 s a frame, so the default
# stride would spend hours of a 300-epoch run on eval alone. 664 train / 92 held out.
heldout_k: 16
eval_every: 20
checkpoint_every: 20
eval_max_images: 8
# 189 of 756 frames (every 4K video frame) carry no EXIF at all, so a quarter of this
# scene has a never-trained per-image exposure when held out. "neighbours" is what makes
# their held-out numbers mean something (trippy.constants "eval_exposure_mode").
eval_exposure_mode: neighbours

# --- the shade under the big tree, MEASURED (README "Finding the shade frames") ---
# 93 frames in 9 contiguous dark runs whose cameras all sit within 2.5 world units of one
# spot: mean luminance 99.50 vs the scene's 121.31 (sd 14.72), and EXIF ISO median 400 at
# 1/60 s vs ISO 80 at 1/99 s everywhere else -- two unrelated signals agreeing, which is
# what PROJECT.md prescribes. Plus kk-coherent's own 6 shade frames (IMG_3828-3833, mean
# luminance 113.17), which are registered here but 5.79 units away, i.e. a DIFFERENT shady

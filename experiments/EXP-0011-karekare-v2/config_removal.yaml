# alternate: every other shade frame (sorted) is held out and the REST are pushed into
# training -- 50 held out, 49 trained. That is the whole point of this experiment: the
# network must have SEEN the tree before "does it render the shade as shading?" is a fair
# question. `all` would ask the unobserved-region question instead (EXP-0003 full2's 8.49 dB).
forced_heldout_mode: alternate

# TRIPS's schedule ratios scaled to 300 epochs: start_removing_points_epoch/num_epochs =
# 200/600 -> epoch 100, point_removal_epoch_interval/num_epochs = 50/600 -> every 25
# epochs (src/lib/data/Settings.h:403-406). Eight passes: 100, 125, ..., 275.
# `conf_threshold: 0.1` is the optional absolute floor (an independent OR trigger), the
# same value arm A used, so a point that starts negligible and stays there is still caught.
# `min_points` is a trippy addition with no TRIPS counterpart: this cloud is ~4x kkc_15000,
# so the floor is scaled with it.
point_removal:
  enabled: true
  start_epoch: 100
  every_epochs: 25
  mode: relative
  conf_threshold: 0.1
  rel_factor: 0.3
  min_points: 4000000

# Measurement only (the default): every eval logs the point count. The shade audit's
# in-region dark-mass region is built from kk-coherent's own frames and is NOT the big
# tree, so `frames` is pinned to the measured big-tree run instead -- and nothing here
# prunes on that number.
shade_prune:
  enabled: false
  log_dark_mass: true

device: mps
seed: 0

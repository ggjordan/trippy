# EXP-0011 FULL-RES SMOKE: the config_fullres.yaml recipe at REAL width/crop (2016/512,
# unshrunk) on a handful of images, resuming the REAL kkv2-1-full-masked checkpoint.
#
# Purpose: prove rc 0 on the three things config_fullres.yaml adds over the already-proven
# config.yaml recipe, before committing a 12 h GPU job to it:
#   1. building a FRESH width-2016 undistortion+mask cache (this scene has never been
#      undistorted above width 1008 -- see README "Scale"; cache validity is asserted
#      against live COLMAP intrinsics, so a first build at a new width is exactly what
#      config_fullres.yaml's own first run will do, just for 140 images instead of 756);
#   2. `--resume`-ing a checkpoint whose OWN cfg says width 1008 / crop 384 into a Trainer
#      built at width 2016 / crop 512 -- structurally proven safe by code (Trainer.resume
#      never reads cfg.width/cfg.crop) and empirically on synthetic fixtures (see
#      config_fullres.yaml's comment), but this is the first time it happens against the
#      REAL 7,542,137-point checkpoint and the REAL net/camera/pose shapes, which is the
#      one thing a synthetic-fixture check cannot cover;
#   3. `Trainer.load_state`'s point-count resize path actually firing at this scale (the
#      smoke's own `point_source.max_points: 300000` build is immediately discarded and
#      replaced by the checkpoint's 7,542,137 points -- see config_fullres.yaml's note).
#
# `limit_images: 140` (not the full 756): sorted image names put IMG_3828.jpg-IMG_3833.jpg
# (the kk-coherent shade group, README "The kk-coherent shade frames are a DIFFERENT shady
# place") at indices 120-125, so 140 images is the smallest round cut that still exercises
# the REAL forced_heldout/alternate-split code path against real forced frames (3 held out,
# 3 pushed into training) rather than silently degrading to an empty shade group --
# `trippy.scene.splits.split_with_forced_heldout` drops forced names absent from `names`
# rather than raising, so a smaller cut would still return rc 0 but would prove less. The
# 93-frame big-tree group (IMG_4032 on) sorts later and is NOT included here; that group is
# only exercised for real once the full run's own images are all present.
#
# width 2016 / crop 512 are UNCHANGED from config_fullres.yaml (unlike config_smoke.yaml,
# which halves config.yaml's width/crop to 504/192) -- shrinking either one here would mean
# the smoke never actually builds the width-2016 cache or runs a real 512-crop step, which
# are exactly the two things this smoke exists to de-risk.
#
# Run via: scripts/gpu_submit.sh --prio 15 kkv2-9-fullres-smoke -- bash -c "..." (see
# research/trips-metal.md submission line) -- never invoked directly.
run_dir: /Users/nzbirdranch/trippy/output/runs/EXP-0011-karekare-v2/kkv2-9-fullres-smoke

scene_root: /Users/nzbirdranch/Splats/scenes/karekare/karekare-v2
limit_images: 140

masks_dir: ""
use_masks: true

width: 2016
crop: 512
mode: broadcast
layers: 5
epochs: 2
train_factor: 0.05

point_source:
  type: gaussian
  path: /Users/nzbirdranch/Splats/output/Training-Data/karekare/karekare-lid/kklid_20000.ply
  min_opacity: 0.05
  # Discarded on --resume (see config_fullres.yaml); kept small so a --resume-less
  # invocation of this file is still a fast, well-formed smoke on its own.
  max_points: 300000
  size_mode: knn
  seed: 0

heldout_k: 16
eval_every: 1
checkpoint_every: 1
eval_max_images: 4
eval_exposure_mode: neighbours

